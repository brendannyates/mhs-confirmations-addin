<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmations</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="dev-updates.css?v=2">
</head>
<body>
<header>
  <div class="titlebar"><h1>Confirmations needed</h1><button id="refresh" title="Re-read the workbook" aria-label="Refresh">&#8635;</button></div>
  <div id="me" class="me" hidden></div>
  <div id="window" class="muted">Loading…</div>
</header>

<section class="opts">
  <label><input type="checkbox" id="optToday" checked> Include today</label>
  <label><input type="checkbox" id="optCancelled" checked> Skip cancelled</label>
  <label><input type="checkbox" id="optNotes"> Include Clinic Notes in email</label>
  <label class="url">Workbook link for "View"
    <input type="text" id="baseUrl" placeholder="https://…sharepoint.com/…/file.xlsx?web=1">
  </label>
</section>

<div id="warnings"></div>
<main id="clinics"></main>

<div id="preview" hidden>
  <div class="bar">
    <strong id="pvTitle"></strong>
    <span>
      <button id="pvCopy">Copy email</button>
      <button id="pvClose" class="ghost">Close</button>
    </span>
  </div>
  <div class="muted" id="pvMeta"></div>
  <div id="pvBody"></div>
</div>

<div id="gate"><div class="boot" role="status" aria-live="polite"><div class="bootin"><div class="spinner" aria-hidden="true"></div><h1>Confirmations</h1><p class="muted">Loading…</p></div></div></div>

<script src="core.js?v=2"></script>
<script src="dev-updates.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
